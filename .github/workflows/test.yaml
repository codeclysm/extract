name: test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build native
        run: go build -v ./...
        shell: bash

      - name: Run unit tests
        run: go test -v -race -bench=. ./...
        shell: bash
